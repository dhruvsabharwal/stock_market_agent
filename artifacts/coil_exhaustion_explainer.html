<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Coil — Seller Exhaustion Explainer</title>
<style>
  body {
    margin: 0;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 32px 16px;
    min-height: 100vh;
    box-sizing: border-box;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e3dc;
    border-radius: 12px;
    padding: 24px;
    max-width: 720px;
    width: 100%;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  h2 {
    margin: 0 0 4px;
    font-size: 17px;
    font-weight: 500;
    color: #1a1a18;
  }
  p.sub {
    margin: 0 0 20px;
    font-size: 13px;
    color: #73726c;
  }
  svg { display: block; width: 100%; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a18; }
    .card { background: #242422; border-color: #3a3a38; }
    h2 { color: #e8e6df; }
    p.sub { color: #9c9a92; }
  }
</style>
</head>
<body>
<div class="card">
  <h2>The Coil — How Seller Exhaustion Works</h2>
  <p class="sub">Base breakout strategy · Three acts of accumulation before the launch</p>

  </defs>

  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" x="570" y="22" text-anchor="middle" fill="#73726c">Act 3 — launch</text>

  <line x1="460" y1="305" x2="460" y2="311" stroke="#73726c" stroke-width="0.5"/>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" x="428" y="320" text-anchor="middle" fill="#73726c">−3%</text>

  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" x="530" y="245" text-anchor="middle" fill="#0F6E56">no sellers left</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" x="530" y="258" text-anchor="middle" fill="#0F6E56">any buying = gap up</text>
  <line x1="530" y1="262" x2="530" y2="218" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Volume bars -->
  <!-- Act 1: panic vol -->
  <rect x="155" y="365" width="8" height="28" rx="1" fill="#D85A30" opacity="0.55"/>
  <rect x="167" y="362" width="8" height="31" rx="1" fill="#D85A30" opacity="0.6"/>

  <rect x="215" y="373" width="7" height="20" rx="1" fill="#378ADD" opacity="0.35"/>
  <rect x="228" y="376" width="7" height="17" rx="1" fill="#378ADD" opacity="0.3"/>

  <rect x="319" y="384" width="7" height="9"  rx="1" fill="#378ADD" opacity="0.17"/>

  <rect x="397" y="387" width="7" height="5"  rx="1" fill="#378ADD" opacity="0.11"/>
  <rect x="410" y="387" width="7" height="4"  rx="1" fill="#534AB7" opacity="0.30"/>
  <rect x="423" y="387" width="7" height="4"  rx="1" fill="#534AB7" opacity="0.28"/>
  <rect x="436" y="388" width="7" height="3"  rx="1" fill="#534AB7" opacity="0.25"/>
  <rect x="449" y="388" width="7" height="3"  rx="1" fill="#534AB7" opacity="0.22"/>
  <!-- Act 3: demand flood -->
  <rect x="466" y="358" width="9" height="35" rx="1" fill="#1D9E75" opacity="0.7"/>
  <rect x="480" y="350" width="9" height="43" rx="1" fill="#1D9E75" opacity="0.8"/>
  <rect x="494" y="345" width="9" height="48" rx="1" fill="#1D9E75" opacity="0.9"/>

  <!-- Vol labels -->
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" x="172" y="402" text-anchor="middle" fill="#993C1D">panic selling</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" x="338" y="402" text-anchor="middle" fill="#73726c">volume evaporates — no sellers left</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" x="485" y="402" text-anchor="middle" fill="#0F6E56">demand flood</text>

  <!-- Bottom caption -->
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" x="340" y="440" text-anchor="middle" fill="#73726c">The coil: each pullback smaller → less resistance → spring compressed tighter → any demand = explosive release</text>
</svg>

</div>
</body>
</html>
